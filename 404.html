(function(){
  function loadScript(src, attrs){

    s.src=src;
    if(attrs) for(var k in attrs) s.setAttribute(k, attrs[k]);
    s.async=true;
    document.head.appendChild(s);
    return s;
  }
  function loadGtag(){
    loadScript('https://www.googletagmanager.com/gtag/js?id=G-JSG9KGPK0S');
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    window.gtag=gtag;

    gtag('config','G-JSG9KGPK0S');
  }
  function loadAds(){
    loadScript('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5511030780981611', {crossorigin:'anonymous'});
  }
  function idle(fn){
    if('requestIdleCallback' in window) requestIdleCallback(fn,{timeout:3000});
    else setTimeout(fn, 2000);
  }
  window.addEventListener('load', function(){
    idle(loadGtag);
    idle(loadAds);
  });
  var triggered=false;
  function early(){
    if(triggered) return;
    triggered=true;
    loadGtag(); loadAds();
    remove();
  }
  function remove(){
    window.removeEventListener('scroll', early);
    window.removeEventListener('touchstart', early);
    window.removeEventListener('click', early);
  }
  window.addEventListener('scroll', early, {passive:true, once:true});
  window.addEventListener('touchstart', early, {passive:true, once:true});
  window.addEventListener('click', early, {once:true});
})();
</script>
